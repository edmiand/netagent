# `active` is the default model for every new chat. Users can switch models
# mid-session from the ⚙️ Settings panel in the web UI (per-chat, no restart).
# The picker lists every model below except those with `enabled: false`;
# `active` is always listed even if disabled. Editing this file needs an app
# restart to take effect.
#
# model: optional Ollama model name when it differs from the key (the key is
#   what the picker shows). Defaults to the key itself.
#
# context_window: model's context length in tokens, per its ollama.com page.
#   Mapped to Ollama's num_ctx. For `-cloud` models this is advisory — the
#   cloud host enforces the real limit; for local models it sizes the KV cache
#   (and RAM use) directly.
active: gemma4:31b-cloud

models:
  gpt-oss:120b-cloud:
    base_url: http://localhost:11434
    temperature: 0
    max_tokens: 4096
    context_window: 131072      # 128K — ollama.com/library/gpt-oss
    thinking: true
    description: "Cloud OSS model via local Ollama"

  gemma4:31b-cloud:
    base_url: http://localhost:11434
    temperature: 0
    max_tokens: 4096
    context_window: 262144      # 256K — ollama.com/library/gemma4:31b-cloud
    thinking: true
    description: "Cloud Google model via local Ollama"

  nemotron-3-ultra:cloud:
    base_url: http://localhost:11434
    temperature: 0
    max_tokens: 4096
    context_window: 1048576     # 1M — ollama.com/library/nemotron-3-ultra:cloud
    thinking: true
    description: "NVIDIA Nemotron-3-Ultra model via local Ollama"

  # local-ollama-* — models on the host Mac (Apple Silicon), reached via the VM's gateway IP:
  # on-prem inference, no prompt or tool output leaves the site. The Mac must run Ollama with
  # OLLAMA_HOST=0.0.0.0 (or the bridge IP), and each model must be pulled there first
  # (`ollama pull <model>`), or picking it fails on the first message. The key is the picker
  # label; `model:` is the Ollama tag. Any model added here must support tools and thinking
  # (`ollama show <model>`). Tags, capabilities and max context checked on ollama.com
  # 2026-11-04. context_window is kept at 32K: for a local model it sizes the KV cache in the
  # Mac's RAM, so raise it only if memory allows (max noted per entry). Vet each with
  # `scripts/rca_bench.py <key>` before making one the default.

  local-ollama-qwen3.8:
    # Main pick. Newest Qwen; tools, thinking, vision. MLX build (Apple Silicon). 18 GB.
    model: qwen3.8:27b-mlx
    base_url: &local_ollama http://192.168.64.1:11434   # shared by the local-ollama-* entries
    temperature: 0
    max_tokens: 4096
    context_window: 32768       # max 256K — ollama.com/library/qwen3.8
    thinking: true
    description: "Host Mac — Qwen 3.8 27B (MLX), main local pick"

  local-ollama-nemotron-3.5-lightning:
    # Test against it. Tools, thinking, text only; its page lists telecom uses (alarm triage,
    # config optimization). MLX build. 19 GB.
    model: nemotron-3.5-lightning:30b-mlx
    base_url: *local_ollama
    temperature: 0
    max_tokens: 4096
    context_window: 32768       # max 256K for the MLX tag — ollama.com/library/nemotron-3.5-lightning
    thinking: true
    description: "Host Mac — Nemotron 3.5 Lightning 30B (MLX), telecom-oriented"

  local-ollama-gpt-oss:
    # Fast option. Reliable tool calling, adjustable reasoning effort; small enough to run
    # alongside a larger model. 14 GB.
    model: gpt-oss:20b
    base_url: *local_ollama
    temperature: 0
    max_tokens: 4096
    context_window: 32768       # max 128K — ollama.com/library/gpt-oss
    thinking: true
    description: "Host Mac — gpt-oss 20B, fast local option"

  local-ollama-gemma4:
    # Lightweight option. Mixture of experts, ~4B active parameters per token, so fast; tools,
    # thinking, vision. 16–19 GB.
    model: gemma4:26b
    base_url: *local_ollama
    temperature: 0
    max_tokens: 4096
    context_window: 32768       # max 256K — ollama.com/library/gemma4
    thinking: true
    description: "Host Mac — Gemma 4 26B MoE, lightweight local option"

  qwen2.5:7b:
    base_url: http://localhost:11434
    temperature: 0
    max_tokens: 4096
    context_window: 32768       # 32K — ollama.com/library/qwen2.5; full window
                                # needs far more than the ~5GB below — lower it
                                # if RAM-constrained
    enabled: false   # hidden from the in-chat model picker; drop this line to offer it
    description: "Lighter local option — needs ~5GB RAM"

embeddings:
  model: nomic-embed-text
  base_url: http://localhost:11434
