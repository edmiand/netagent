[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "5g-demo-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=2.12.0",
    "langchain>=1.2,<2",
    "langgraph>=1.2.11",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.29.1,<2.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "aiosqlite>=0.20",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "langchain-text-splitters>=0.3.0",
    "tavily-python>=0.5.0",
    "hiero-sdk-python==0.3.0",  # Pre-Alpha, API churns between minors — see HEDERA.md
    "eqty_sdk==2.5.0",
    "eqty-lineage-langchain>=0.2.5",
]

[project.optional-dependencies]
# Guardian Platform mode (config/guardian.yaml). The SDK is pre-release: install it
# from EQTY Lab's Cloudsmith index, or `pip install --no-deps ~/guardian/sdks/python`.
guardian = ["eqty-guardian-agent[langchain,mcp]"]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["agent", "visualizations", "prompts"]
